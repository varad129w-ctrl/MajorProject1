<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 - Page Not Found | TripCraft</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0f7fa, #ffffff);
      padding: 20px;
    }

    .error-container {
      text-align: center;
      max-width: 600px;
    }

    .error-code {
      font-size: 150px;
      font-weight: 800;
      color: #00a8a8;
      line-height: 1;
      text-shadow: 5px 5px 0 #b2ebf2;
    }

    .error-container h1 {
      font-size: 32px;
      color: #222;
      margin: 20px 0 10px;
    }

    .error-container p {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .home-btn {
      display: inline-block;
      text-decoration: none;
      background: #00a8a8;
      color: white;
      padding: 13px 28px;
      border-radius: 30px;
      font-weight: 600;
      transition: 0.3s;
    }

    .home-btn:hover {
      background: #007f7f;
      transform: translateY(-3px);
    }

    .emoji {
      font-size: 55px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 100px;
      }

      .error-container h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <div class="error-container">

    <div class="error-code">404</div>

    <h1>Oops! You’re Lost</h1>

    <p>
      Looks like this destination doesn’t exist.
      Let’s take you back to your travel journey.
    </p>

    <a href="home.html" class="home-btn">
      Back to Home
    </a>
  </div>
</body>
</html>
